<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RL Replay XR</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<style>
  :root { --fg: #e8eef7; --dim: #8b97a8; --panel: rgba(12,16,22,.82); --blue: #2f7bff; --orange: #ff8a1f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e13; color: var(--fg); font: 14px/1.3 system-ui, sans-serif; }
  canvas { display: block; }
  .glass { background: var(--panel); backdrop-filter: blur(10px); border: 1px solid #ffffff14; border-radius: 12px; }
  #top { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; padding: 8px 10px; flex-wrap: wrap; }
  #top b { font-weight: 700; letter-spacing: .02em; margin-right: 6px; }
  #status, #info { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #info { margin-left: auto; }
  button, select, label.btn { background: #232a35; color: var(--fg); border: 0; border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer; }
  button:hover, label.btn:hover { background: #2e3746; }
  .xr { background: #e8eef7; color: #0b0e13; font-weight: 600; }
  #score { position: fixed; top: 70px; left: 50%; translate: -50%; display: flex; gap: 14px; align-items: center; padding: 6px 16px; font: 700 22px system-ui; }
  #s0 { color: var(--blue); } #s1 { color: var(--orange); }
  #clock { min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
  #banner { position: fixed; top: 28%; left: 0; right: 0; text-align: center; font: 800 clamp(32px, 7vw, 84px) system-ui; letter-spacing: .04em; text-shadow: 0 4px 30px #000; pointer-events: none; }
  #bar { position: fixed; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 8px; align-items: center; padding: 8px 10px; }
  #track { position: relative; flex: 1; }
  #seek { width: 100%; accent-color: #c9d4e3; }
  #marks i { position: absolute; top: -6px; width: 3px; height: 8px; translate: -50%; border-radius: 2px; pointer-events: none; }
  #drop { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0e13cc; font: 600 24px system-ui; border: 3px dashed #ffffff40; }
  #help { color: var(--dim); font-size: 12px; }
  [hidden] { display: none !important; }
  @media (max-width: 640px) { #info, #help { display: none; } }
</style>
</head>
<body>
<div id="top" class="glass">
  <b>RL Replay XR</b>
  <label class="btn">Open .replay<input id="file" type="file" accept=".replay" hidden></label>
  <button id="sample">Sample</button>
  <span id="status">Drop a .replay anywhere</span>
  <span id="info"></span>
  <button id="vr" class="xr" hidden>Enter VR</button>
  <button id="ar" class="xr" hidden>Enter AR</button>
</div>
<div id="score" class="glass"><span id="s0">0</span><span id="clock">5:00</span><span id="s1">0</span></div>
<div id="banner" hidden></div>
<div id="bar" class="glass" hidden>
  <button id="play">▶</button>
  <div id="track"><input id="seek" type="range"><div id="marks"></div></div>
  <select id="speed"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select>
  <select id="cam"></select>
  <span id="help">space · ←/→ · 0–8</span>
</div>
<div id="drop" hidden>Drop .replay</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
